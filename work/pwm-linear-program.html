<section id="pwm-linear-program">
  <canvas role="img" aria-label="PWM 두 그룹의 그래프. 평균 대비 ±5%를 만족하는 영역은 대각선 부근의 삼각형입니다. 영역에서 평균 밝기가 가장 큰 점은 그룹 1 약 92.47%, 그룹 2 100%입니다."></canvas>
  <style>
    #pwm-linear-program canvas { display: block; width: 100%; height: 320px; }
  </style>
  <script>
    (() => {
      const root = document.getElementById("pwm-linear-program");
      const canvas = root.querySelector("canvas");
      const ctx = canvas.getContext("2d");
      const optimum = 100 * 6.75 / 7.3;

      function draw() {
        const { width, height } = canvas.getBoundingClientRect();
        if (width === 0) return;
        const scale = window.devicePixelRatio || 1;
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        const style = getComputedStyle(root);
        const color = name => style.getPropertyValue(name).trim();
        const foreground = color("--foreground");
        const active = color("--viz-series-1") || color("--blue");
        const grid = color("--border");
        const font = getComputedStyle(canvas).fontFamily;
        ctx.font = "13px " + font;

        const left = 52;
        const right = width - 26;
        const top = 42;
        const bottom = height - 52;
        const px = value => left + (right - left) * value / 100;
        const py = value => bottom - (bottom - top) * value / 100;
        function line(x0, y0, x1, y1) {
          ctx.beginPath();
          ctx.moveTo(x0, y0);
          ctx.lineTo(x1, y1);
          ctx.stroke();
        }

        ctx.strokeStyle = grid;
        ctx.fillStyle = foreground;
        for (let tick = 0; tick <= 100; tick += 25) {
          line(px(tick), top, px(tick), bottom);
          line(left, py(tick), right, py(tick));
          ctx.textAlign = "center";
          ctx.fillText(tick, px(tick), bottom + 18);
          ctx.textAlign = "right";
          ctx.fillText(tick, left - 8, py(tick) + 4);
        }
        ctx.textAlign = "center";
        ctx.fillText("그룹 1 PWM (%)", (left + right) / 2, height - 12);
        ctx.textAlign = "left";
        ctx.fillText("그룹 2 PWM (%)", 0, 14);

        ctx.beginPath();
        ctx.moveTo(px(0), py(0));
        ctx.lineTo(px(100 * 5 / 6), py(100));
        ctx.lineTo(px(optimum), py(100));
        ctx.closePath();
        ctx.fillStyle = active;
        ctx.globalAlpha = 0.22;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = active;
        ctx.stroke();

        ctx.fillStyle = foreground;
        ctx.fillText("균일도 ±5% 영역", left + 8, py(68));
        ctx.strokeStyle = active;
        line(left + 58, py(68) + 8, px(50), py(58));

        ctx.fillStyle = active;
        ctx.beginPath();
        ctx.arc(px(optimum), top, 4, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = foreground;
        ctx.textAlign = "right";
        ctx.fillText("최대 평균 밝기", px(optimum) - 8, top - 7);
        ctx.strokeStyle = foreground;
        ctx.strokeRect(right - 3, top - 3, 6, 6);
        ctx.fillText("둘 다 100% · 기준 초과", right - 6, top + 28);
      }

      new ResizeObserver(draw).observe(root);
      window.addEventListener("openai:set_globals", draw);
      draw();
    })();
  </script>
</section>
